[project]
name = "wm-config-llm"
version = "0.1.0"
description = "A tiny local model that edits Sway and Hyprland configs"
requires-python = ">=3.12,<3.14"
# The CLI (cli/wmai.py) and the data pipeline use only the standard library.
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.7",
    "transformers>=4.56",
    "peft>=0.17",
    "trl>=0.23",
    "datasets>=4.0",
    "accelerate>=1.10",
    "sentencepiece",
    "protobuf",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
